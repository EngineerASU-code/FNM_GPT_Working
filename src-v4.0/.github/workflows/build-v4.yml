name: Temporary Configurator 4.3.3 package

on:
  push:
    branches: [main]
    paths:
      - 'src-v4.0/**/*.cs'
      - 'src-v4.0/**/*.xaml'
      - 'src-v4.0/**/*.csproj'
      - 'src-v4.0/**/*.slnx'

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        working-directory: src-v4.0
        run: dotnet restore Configurator.csproj
      - name: Build
        working-directory: src-v4.0
        run: dotnet build Configurator.csproj -c Release --no-restore
      - name: Create source archive
        shell: pwsh
        run: |
          if (Test-Path Configurator_v4.3.3.zip) { Remove-Item Configurator_v4.3.3.zip -Force }
          Compress-Archive -Path src-v4.0/* -DestinationPath Configurator_v4.3.3.zip -Force
      - name: Publish archive to main
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Configurator_v4.3.3.zip
          git commit -m "package: Configurator 4.3.3" || true
          git push origin main
