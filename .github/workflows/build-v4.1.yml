name: Build Configurator 4.3

on:
  push:
    branches: [main]
    paths:
      - 'src-v4.0/**'
      - '.github/workflows/build-v4.1.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        working-directory: src-v4.0
        run: dotnet restore Configurator.csproj
      - name: Build 4.3
        working-directory: src-v4.0
        run: dotnet build Configurator.csproj -c Release --no-restore
      - name: Create 4.3 source archive
        shell: pwsh
        working-directory: src-v4.0
        run: |
          if (Test-Path Configurator_v4.3.zip) { Remove-Item Configurator_v4.3.zip -Force }
          $items = Get-ChildItem -Force | Where-Object { $_.Name -notin @('.git','bin','obj','Configurator_v4.3.zip') }
          Compress-Archive -Path $items.FullName -DestinationPath Configurator_v4.3.zip -Force
      - name: Publish 4.3 archive to main
        shell: bash
        run: |
          set -e
          cp src-v4.0/Configurator_v4.3.zip /tmp/Configurator_v4.3.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          cp /tmp/Configurator_v4.3.zip Configurator_v4.3.zip
          git add Configurator_v4.3.zip
          git commit -m "release: Configurator 4.3 [skip ci]" || true
          git push origin main
