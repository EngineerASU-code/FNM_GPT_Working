name: Inspect 3.16.3 exporter
on:
  push:
    paths:
      - '.github/workflows/inspect-exporter.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect archive
        run: |
          rm -rf work
          mkdir work
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          src=Path('Configurator_v3.16.3.zip')
          root=Path('work/src')
          root.mkdir(parents=True)
          with zipfile.ZipFile(src) as z:
              z.extractall(root)
          matches=[]
          for p in root.rglob('*.cs'):
              try: s=p.read_text(encoding='utf-8-sig')
              except UnicodeDecodeError: continue
              if 'Excel' in p.name or 'Export' in p.name or 'Excel' in s or 'Export' in s:
                  for i,line in enumerate(s.splitlines(),1):
                      if '(int)' in line or 'Int32' in line or 'Convert.ToInt32' in line or 'Excel' in line or 'Export' in line:
                          matches.append(f'{p.relative_to(root)}:{i}:{line}')
          print('\n'.join(matches))
          PY
# retrigger
