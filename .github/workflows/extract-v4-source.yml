name: Extract v4 source

on:
  push:
    paths:
      - 'Configurator_v4.0.zip'
      - '.github/workflows/extract-v4-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract source archive
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "src-v4.0" ]; then
            echo "src-v4.0 already exists; nothing to extract."
            exit 0
          fi
          mkdir -p .v4extract src-v4.0
          unzip -q Configurator_v4.0.zip -d .v4extract
          shopt -s dotglob
          if [ "$(find .v4extract -mindepth 1 -maxdepth 1 | wc -l)" -eq 1 ] && [ -d "$(find .v4extract -mindepth 1 -maxdepth 1 -type d | head -1)" ]; then
            root="$(find .v4extract -mindepth 1 -maxdepth 1 -type d | head -1)"
            cp -a "$root"/. src-v4.0/
          else
            cp -a .v4extract/. src-v4.0/
          fi
          rm -rf .v4extract

      - name: Commit extracted source
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- src-v4.0)" ]; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-v4.0
          git commit -m "chore: expose Configurator 4.0 source"
          git push
