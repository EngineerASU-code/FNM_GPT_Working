name: Fix Configurator 3.16.4
on:
  push:
    paths:
      - '.github/workflows/fix-3-16-4.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract 3.16.3
        run: |
          rm -rf /tmp/app
          mkdir /tmp/app
          unzip -q Configurator_v3.16.3.zip -d /tmp/app
      - name: Fix SQL metadata numeric conversions and version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('/tmp/app')
          p=root/'Services'/'DatabaseExcelExportService.cs'
          s=p.read_text(encoding='utf-8-sig')
          old=s
          s=re.sub(r'\br\.GetInt32\((\d+)\)', r'Convert.ToInt32(r.GetValue(\1))', s)
          if s==old:
              raise SystemExit('No GetInt32 calls found in DatabaseExcelExportService.cs')
          p.write_text(s,encoding='utf-8-sig',newline='\n')
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.cs','.xaml','.csproj','.json','.config','.txt'}:
                  continue
              try: t=p.read_text(encoding='utf-8-sig')
              except UnicodeDecodeError: continue
              nt=t.replace('3.16.3','3.16.4')
              if nt!=t: p.write_text(nt,encoding='utf-8-sig',newline='\n')
          print('Patched metadata conversions and version.')
          PY
      - name: Build
        working-directory: /tmp/app
        run: |
          dotnet restore Configurator.csproj -p:EnableWindowsTargeting=true
          dotnet build Configurator.csproj --configuration Release --no-restore -p:EnableWindowsTargeting=true
      - name: Package and verify
        run: |
          rm -f Configurator_v3.16.4.zip
          cd /tmp/app
          zip -qr "$GITHUB_WORKSPACE/Configurator_v3.16.4.zip" . -x 'bin/*' 'obj/*' '.git/*'
          unzip -t "$GITHUB_WORKSPACE/Configurator_v3.16.4.zip"
          test -s "$GITHUB_WORKSPACE/Configurator_v3.16.4.zip"
      - name: Commit 3.16.4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Configurator_v3.16.4.zip
          git commit -m "fix: release Configurator 3.16.4 with robust DB export metadata conversion"
          git push
