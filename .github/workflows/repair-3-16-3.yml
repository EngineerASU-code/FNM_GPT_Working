name: Repair Configurator 3.16.3
on:
  push:
    paths:
      - '.github/workflows/repair-3-16-3.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract archive
        run: |
          rm -rf /tmp/app
          mkdir /tmp/app
          unzip -q Configurator_v3.16.3.zip -d /tmp/app
      - name: Restore missing export handler
        run: |
          cat > /tmp/app/MainWindow/MainWindow.DatabaseExport.cs <<'EOF'
          using System;
          using System.IO;
          using System.Linq;
          using System.Windows;
          using System.Windows.Input;
          using Microsoft.Win32;

          namespace Configurator
          {
              public partial class MainWindow
              {
                  private async void MenuDatabaseExportExcel_Click(object sender, RoutedEventArgs e)
                  {
                      var databaseName = _selectedDbName;
                      if (string.IsNullOrWhiteSpace(databaseName)) databaseName = GetActiveDatabases().FirstOrDefault();
                      if (string.IsNullOrWhiteSpace(databaseName))
                      {
                          MessageBox.Show("Сначала подключите и выберите базу данных.", "Экспорт БД", MessageBoxButton.OK, MessageBoxImage.Information);
                          return;
                      }
                      var dialog = new SaveFileDialog { Title = "Экспорт выбранной БД в Excel", Filter = "Excel workbook (*.xlsx)|*.xlsx", DefaultExt = ".xlsx", FileName = $"{databaseName}_SchemaExport.xlsx", AddExtension = true };
                      if (dialog.ShowDialog(this) != true) return;
                      try
                      {
                          Mouse.OverrideCursor = Cursors.Wait;
                          await ExcelExportService.ExportDatabaseAsync(_connection.ToConnectionString(databaseName), dialog.FileName);
                          LogAction($"Экспорт БД «{databaseName}» в Excel: {Path.GetFileName(dialog.FileName)}");
                          MessageBox.Show($"Экспорт завершён.\n\nБаза: {databaseName}\nФайл: {dialog.FileName}", "Экспорт БД", MessageBoxButton.OK, MessageBoxImage.Information);
                      }
                      catch (Exception ex)
                      {
                          MessageBox.Show($"Не удалось экспортировать базу данных:\n\n{ex.Message}", "Ошибка экспорта БД", MessageBoxButton.OK, MessageBoxImage.Error);
                      }
                      finally { Mouse.OverrideCursor = null; }
                  }
              }
          }
          EOF
      - name: Restore
        working-directory: /tmp/app
        run: dotnet restore Configurator.csproj -p:EnableWindowsTargeting=true
      - name: Build diagnostics
        working-directory: /tmp/app
        continue-on-error: true
        run: dotnet build Configurator.csproj --configuration Release --no-restore -p:EnableWindowsTargeting=true > /tmp/build.log 2>&1
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repair-3.16.3-build-log
          path: /tmp/build.log
      - name: Repackage and verify
        run: |
          rm -f Configurator_v3.16.3.zip
          cd /tmp/app
          zip -qr "$GITHUB_WORKSPACE/Configurator_v3.16.3.zip" . -x 'bin/*' 'obj/*' '.git/*'
          unzip -t "$GITHUB_WORKSPACE/Configurator_v3.16.3.zip"
