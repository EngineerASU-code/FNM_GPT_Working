name: Repair Configurator 3.16.3
on:
  push:
    paths:
      - '.github/workflows/repair-3-16-3.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract archive
        run: |
          rm -rf /tmp/app
          mkdir /tmp/app
          unzip -q Configurator_v3.16.3.zip -d /tmp/app
      - name: Add database Excel export implementation
        run: |
          cat > /tmp/app/Services/DatabaseExcelExportService.cs <<'EOF'
          using System;
          using System.Collections.Generic;
          using System.Data;
          using System.Globalization;
          using System.IO;
          using System.IO.Compression;
          using System.Linq;
          using System.Security;
          using System.Text;
          using System.Threading;
          using System.Threading.Tasks;
          using Microsoft.Data.SqlClient;

          namespace Configurator;

          public static class DatabaseExcelExportService
          {
              public static async Task ExportAsync(string connectionString, string filePath, CancellationToken ct = default)
              {
                  using var cn = new SqlConnection(connectionString);
                  await cn.OpenAsync(ct);
                  var tables = await Tables(cn, ct);
                  var fks = await ForeignKeys(cn, ct);
                  var pks = await PrimaryKeys(cn, ct);
                  var indexes = await Indexes(cn, ct);
                  using var fs = File.Create(filePath);
                  using var zip = new ZipArchive(fs, ZipArchiveMode.Create);
                  int count = tables.Count + 4;
                  Add(zip, "[Content_Types].xml", ContentTypes(count));
                  Add(zip, "_rels/.rels", "<?xml version=\"1.0\"?><Relationships xmlns=\"http://schemas.openxmlformats.org/package/2006/relationships\"><Relationship Id=\"rId1\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument\" Target=\"xl/workbook.xml\"/></Relationships>");
                  Add(zip, "xl/workbook.xml", Workbook(tables));
                  Add(zip, "xl/_rels/workbook.xml.rels", WorkbookRels(count));
                  Add(zip, "xl/styles.xml", Styles());
                  Sheet(zip, 1, "__SchemaInfo", new[] { "Property", "Value" }, new[] { new object[] { "ExportedAtUtc", DateTime.UtcNow.ToString("O") }, new object[] { "TableCount", tables.Count }, new object[] { "PrimaryKeyCount", pks.Count }, new object[] { "ForeignKeyCount", fks.Count }, new object[] { "IndexCount", indexes.Count }, new object[] { "Note", "Export is read-only and does not modify database relations." } });
                  Sheet(zip, 2, "__PrimaryKeys", new[] { "Schema", "Table", "Column", "KeyOrdinal" }, pks.Select(x => new object[] { x.Schema, x.Table, x.Column, x.Ordinal }));
                  Sheet(zip, 3, "__ForeignKeys", new[] { "Constraint", "SourceSchema", "SourceTable", "SourceColumn", "TargetSchema", "TargetTable", "TargetColumn", "KeyOrdinal" }, fks.Select(x => new object[] { x.Name, x.SourceSchema, x.SourceTable, x.SourceColumn, x.TargetSchema, x.TargetTable, x.TargetColumn, x.Ordinal }));
                  Sheet(zip, 4, "__Indexes", new[] { "Schema", "Table", "IndexName", "IsUnique", "IsPrimaryKey", "Column", "KeyOrdinal", "IsIncluded" }, indexes.Select(x => new object[] { x.Schema, x.Table, x.Name, x.Unique, x.Primary, x.Column, x.Ordinal, x.Included }));
                  int id = 5;
                  foreach (var t in tables) { ct.ThrowIfCancellationRequested(); await TableSheet(zip, id++, t.Schema, t.Name, cn, ct); }
              }

              static async Task<List<TableInfo>> Tables(SqlConnection c, CancellationToken ct) { using var q = new SqlCommand("SELECT TABLE_SCHEMA,TABLE_NAME FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_TYPE='BASE TABLE' ORDER BY TABLE_SCHEMA,TABLE_NAME", c); using var r = await q.ExecuteReaderAsync(ct); var a = new List<TableInfo>(); while (await r.ReadAsync(ct)) a.Add(new(r.GetString(0),r.GetString(1))); return a; }
              static async Task<List<FkInfo>> ForeignKeys(SqlConnection c, CancellationToken ct) { const string s="SELECT fk.name,s1.name,t1.name,c1.name,s2.name,t2.name,c2.name,fkc.constraint_column_id FROM sys.foreign_keys fk JOIN sys.foreign_key_columns fkc ON fk.object_id=fkc.constraint_object_id JOIN sys.tables t1 ON fkc.parent_object_id=t1.object_id JOIN sys.schemas s1 ON t1.schema_id=s1.schema_id JOIN sys.columns c1 ON c1.object_id=t1.object_id AND c1.column_id=fkc.parent_column_id JOIN sys.tables t2 ON fkc.referenced_object_id=t2.object_id JOIN sys.schemas s2 ON t2.schema_id=s2.schema_id JOIN sys.columns c2 ON c2.object_id=t2.object_id AND c2.column_id=fkc.referenced_column_id ORDER BY s1.name,t1.name,fk.name,fkc.constraint_column_id"; using var q=new SqlCommand(s,c);using var r=await q.ExecuteReaderAsync(ct);var a=new List<FkInfo>();while(await r.ReadAsync(ct))a.Add(new(r.GetString(0),r.GetString(1),r.GetString(2),r.GetString(3),r.GetString(4),r.GetString(5),r.GetString(6),r.GetInt32(7)));return a; }
              static async Task<List<PkInfo>> PrimaryKeys(SqlConnection c, CancellationToken ct) { const string s="SELECT s.name,t.name,c.name,ic.key_ordinal FROM sys.indexes i JOIN sys.index_columns ic ON i.object_id=ic.object_id AND i.index_id=ic.index_id JOIN sys.tables t ON i.object_id=t.object_id JOIN sys.schemas s ON t.schema_id=s.schema_id JOIN sys.columns c ON c.object_id=ic.object_id AND c.column_id=ic.column_id WHERE i.is_primary_key=1 ORDER BY s.name,t.name,ic.key_ordinal";using var q=new SqlCommand(s,c);using var r=await q.ExecuteReaderAsync(ct);var a=new List<PkInfo>();while(await r.ReadAsync(ct))a.Add(new(r.GetString(0),r.GetString(1),r.GetString(2),r.GetInt32(3)));return a; }
              static async Task<List<IndexInfo>> Indexes(SqlConnection c, CancellationToken ct) { const string s="SELECT s.name,t.name,i.name,i.is_unique,i.is_primary_key,c.name,ic.key_ordinal,ic.is_included_column FROM sys.indexes i JOIN sys.index_columns ic ON i.object_id=ic.object_id AND i.index_id=ic.index_id JOIN sys.tables t ON i.object_id=t.object_id JOIN sys.schemas s ON t.schema_id=s.schema_id JOIN sys.columns c ON c.object_id=ic.object_id AND c.column_id=ic.column_id WHERE i.index_id>0 AND i.is_hypothetical=0 ORDER BY s.name,t.name,i.name,ic.key_ordinal,c.column_id";using var q=new SqlCommand(s,c);using var r=await q.ExecuteReaderAsync(ct);var a=new List<IndexInfo>();while(await r.ReadAsync(ct))a.Add(new(r.GetString(0),r.GetString(1),r.GetString(2),r.GetBoolean(3),r.GetBoolean(4),r.GetString(5),r.GetInt32(6),r.GetBoolean(7)));return a; }

              static async Task TableSheet(ZipArchive z,int id,string schema,string table,SqlConnection c,CancellationToken ct){var e=z.CreateEntry($"xl/worksheets/sheet{id}.xml",CompressionLevel.Fastest);using var w=new StreamWriter(e.Open(),new UTF8Encoding(false),65536);await w.WriteAsync("<?xml version=\"1.0\"?><worksheet xmlns=\"http://schemas.openxmlformats.org/spreadsheetml/2006/main\"><sheetData>");using var q=new SqlCommand($"SELECT * FROM [{schema.Replace("]", "]]" )}].[{table.Replace("]", "]]" )}]",c){CommandTimeout=0};using var r=await q.ExecuteReaderAsync(CommandBehavior.SequentialAccess,ct);int n=Math.Min(r.FieldCount,16384),row=1;await w.WriteAsync("<row r=\"1\">");for(int i=0;i<n;i++)await w.WriteAsync(Cell(r.GetName(i),1,i+1,1));await w.WriteAsync("</row>");while(await r.ReadAsync(ct)&&row<1048576){row++;await w.WriteAsync($"<row r=\"{row}\">");for(int i=0;i<n;i++)await w.WriteAsync(Cell(r.IsDBNull(i)?null:r.GetValue(i),row,i+1));await w.WriteAsync("</row>");}await w.WriteAsync("</sheetData></worksheet>");}
              static void Sheet(ZipArchive z,int id,string name,IReadOnlyList<string> h,IEnumerable<object[]> rows){var e=z.CreateEntry($"xl/worksheets/sheet{id}.xml",CompressionLevel.Fastest);using var w=new StreamWriter(e.Open(),new UTF8Encoding(false));w.Write("<?xml version=\"1.0\"?><worksheet xmlns=\"http://schemas.openxmlformats.org/spreadsheetml/2006/main\"><sheetData><row r=\"1\">");for(int i=0;i<h.Count;i++)w.Write(Cell(h[i],1,i+1,1));w.Write("</row>");int row=1;foreach(var x in rows.Take(1048575)){row++;w.Write($"<row r=\"{row}\">");for(int i=0;i<x.Length;i++)w.Write(Cell(x[i],row,i+1));w.Write("</row>");}w.Write("</sheetData></worksheet>");}
              static string Cell(object v,int row,int col,int style=0){string r=Col(col)+row,s=style>0?$" s=\"{style}\"":"";if(v==null||v==DBNull.Value)return $"<c r=\"{r}\"{s}/>";if(v is bool b)return $"<c r=\"{r}\"{s} t=\"b\"><v>{(b?1:0)}</v></c>";if(v is byte or sbyte or short or ushort or int or uint or long or ulong or float or double or decimal)return $"<c r=\"{r}\"{s}><v>{Convert.ToString(v,CultureInfo.InvariantCulture)}</v></c>";return $"<c r=\"{r}\"{s} t=\"inlineStr\"><is><t xml:space=\"preserve\">{SecurityElement.Escape(Convert.ToString(v,CultureInfo.InvariantCulture)??"")}</t></is></c>";}
              static string Col(int n){string s="";while(n>0){n--;s=(char)('A'+n%26)+s;n/=26;}return s;} static string Safe(string s){s=new string((s??"Лист").Select(c=>char.IsLetterOrDigit(c)||c=='_'||c=='-'||c==' '?c:'_').ToArray());return string.IsNullOrWhiteSpace(s)?"Лист":s.Length>31?s[..31]:s;}
              static void Add(ZipArchive z,string n,string c){var e=z.CreateEntry(n,CompressionLevel.Fastest);using var w=new StreamWriter(e.Open(),new UTF8Encoding(false));w.Write(c);}
              static string ContentTypes(int n)=>$"<?xml version=\"1.0\"?><Types xmlns=\"http://schemas.openxmlformats.org/package/2006/content-types\"><Default Extension=\"rels\" ContentType=\"application/vnd.openxmlformats-package.relationships+xml\"/><Default Extension=\"xml\" ContentType=\"application/xml\"/><Override PartName=\"/xl/workbook.xml\" ContentType=\"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml\"/><Override PartName=\"/xl/styles.xml\" ContentType=\"application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml\"/>{string.Concat(Enumerable.Range(1,n).Select(i=>$"<Override PartName=\"/xl/worksheets/sheet{i}.xml\" ContentType=\"application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml\"/>"))}</Types>";
              static string Workbook(List<TableInfo> t){var n=new[]{"__SchemaInfo","__PrimaryKeys","__ForeignKeys","__Indexes"}.Concat(t.Select(x=>Safe(x.Schema+"_"+x.Name))).ToList();var b=new StringBuilder("<?xml version=\"1.0\"?><workbook xmlns=\"http://schemas.openxmlformats.org/spreadsheetml/2006/main\" xmlns:r=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships\"><sheets>");for(int i=0;i<n.Count;i++)b.Append($"<sheet name=\"{SecurityElement.Escape(n[i])}\" sheetId=\"{i+1}\" r:id=\"rId{i+1}\"/>");return b.Append("</sheets></workbook>").ToString();}
              static string WorkbookRels(int n)=>$"<?xml version=\"1.0\"?><Relationships xmlns=\"http://schemas.openxmlformats.org/package/2006/relationships\">{string.Concat(Enumerable.Range(1,n).Select(i=>$"<Relationship Id=\"rId{i}\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet\" Target=\"worksheets/sheet{i}.xml\"/>"))}<Relationship Id=\"rId{n+1}\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles\" Target=\"styles.xml\"/></Relationships>";
              static string Styles()=>"<?xml version=\"1.0\"?><styleSheet xmlns=\"http://schemas.openxmlformats.org/spreadsheetml/2006/main\"><fonts count=\"2\"><font><sz val=\"11\"/><name val=\"Calibri\"/></font><font><b/><sz val=\"11\"/><name val=\"Calibri\"/></font></fonts><fills count=\"2\"><fill><patternFill patternType=\"none\"/></fill><fill><patternFill patternType=\"gray125\"/></fill></fills><borders count=\"1\"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count=\"1\"><xf numFmtId=\"0\" fontId=\"0\" fillId=\"0\" borderId=\"0\"/></cellStyleXfs><cellXfs count=\"2\"><xf numFmtId=\"0\" fontId=\"0\" fillId=\"0\" borderId=\"0\" xfId=\"0\"/><xf numFmtId=\"0\" fontId=\"1\" fillId=\"0\" borderId=\"0\" xfId=\"0\" applyFont=\"1\"/></cellXfs></styleSheet>";
              record TableInfo(string Schema,string Name); record FkInfo(string Name,string SourceSchema,string SourceTable,string SourceColumn,string TargetSchema,string TargetTable,string TargetColumn,int Ordinal); record PkInfo(string Schema,string Table,string Column,int Ordinal); record IndexInfo(string Schema,string Table,string Name,bool Unique,bool Primary,string Column,int Ordinal,bool Included);
          }
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/app/MainWindow/MainWindow.DatabaseExport.cs')
          s='''using System;\nusing System.IO;\nusing System.Linq;\nusing System.Windows;\nusing System.Windows.Input;\nusing Microsoft.Win32;\nnamespace Configurator { public partial class MainWindow { private async void MenuDatabaseExportExcel_Click(object sender, RoutedEventArgs e) { var databaseName=_selectedDbName; if(string.IsNullOrWhiteSpace(databaseName)) databaseName=GetActiveDatabases().FirstOrDefault(); if(string.IsNullOrWhiteSpace(databaseName)){MessageBox.Show("Сначала подключите и выберите базу данных.","Экспорт БД",MessageBoxButton.OK,MessageBoxImage.Information);return;} var d=new SaveFileDialog{Title="Экспорт выбранной БД в Excel",Filter="Excel workbook (*.xlsx)|*.xlsx",DefaultExt=".xlsx",FileName=$"{databaseName}_SchemaExport.xlsx",AddExtension=true}; if(d.ShowDialog(this)!=true)return; try{Mouse.OverrideCursor=Cursors.Wait; await DatabaseExcelExportService.ExportAsync(_connection.ToConnectionString(databaseName),d.FileName); LogAction($"Экспорт БД «{databaseName}» в Excel: {Path.GetFileName(d.FileName)}"); MessageBox.Show($"Экспорт завершён.\\n\\nБаза: {databaseName}\\nФайл: {d.FileName}","Экспорт БД",MessageBoxButton.OK,MessageBoxImage.Information);}catch(Exception ex){MessageBox.Show($"Не удалось экспортировать базу данных:\\n\\n{ex.Message}","Ошибка экспорта БД",MessageBoxButton.OK,MessageBoxImage.Error);}finally{Mouse.OverrideCursor=null;} } } }'''
          p.write_text(s,encoding='utf-8')
          PY
      - name: Restore and build
        working-directory: /tmp/app
        run: |
          dotnet restore Configurator.csproj -p:EnableWindowsTargeting=true
          dotnet build Configurator.csproj --configuration Release --no-restore -p:EnableWindowsTargeting=true
      - name: Repackage and verify
        run: |
          rm -f Configurator_v3.16.3.zip
          cd /tmp/app
          zip -qr "$GITHUB_WORKSPACE/Configurator_v3.16.3.zip" . -x 'bin/*' 'obj/*' '.git/*'
          unzip -t "$GITHUB_WORKSPACE/Configurator_v3.16.3.zip"
      - name: Commit repaired archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Configurator_v3.16.3.zip
          git commit -m "fix: publish database Excel export in 3.16.3"
          git push
