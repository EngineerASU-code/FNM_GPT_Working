name: Package 4.3.3 test ZIP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create ZIP
        run: |
          rm -f Configurator_v4.3.3.zip
          zip -r Configurator_v4.3.3.zip src-v4.0
          unzip -t Configurator_v4.3.3.zip
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Configurator_v4.3.3
          path: Configurator_v4.3.3.zip
          if-no-files-found: error
