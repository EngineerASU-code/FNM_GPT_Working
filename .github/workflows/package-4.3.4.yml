name: Package 4.3.4
on:
  push:
    branches: [ main ]
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        shell: pwsh
        run: dotnet build src-v4.0/Configurator.csproj -c Release --nologo
      - name: Package
        shell: pwsh
        run: |
          if (Test-Path Configurator_v4.3.4.zip) { Remove-Item Configurator_v4.3.4.zip -Force }
          Compress-Archive -Path src-v4.0\* -DestinationPath Configurator_v4.3.4.zip -Force
      - name: Commit ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Configurator_v4.3.4.zip
          git commit -m 'build: package Configurator 4.3.4' || exit 0
          git push
