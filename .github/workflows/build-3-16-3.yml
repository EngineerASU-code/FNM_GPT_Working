name: Validate Configurator 3.16.3
on:
  push:
    paths:
      - 'Configurator_v3.16.3.zip'
      - '.github/workflows/build-3-16-3.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source archive
        run: |
          rm -rf /tmp/app
          mkdir /tmp/app
          unzip -q Configurator_v3.16.3.zip -d /tmp/app
      - name: Restore
        working-directory: /tmp/app
        run: dotnet restore Configurator.csproj -p:EnableWindowsTargeting=true
      - name: Build and capture diagnostics
        working-directory: /tmp/app
        continue-on-error: true
        run: dotnet build Configurator.csproj --configuration Release --no-restore -p:EnableWindowsTargeting=true > /tmp/build.log 2>&1
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: configurator-3.16.3-build-log
          path: /tmp/build.log
      - name: Verify archive
        run: unzip -t Configurator_v3.16.3.zip
