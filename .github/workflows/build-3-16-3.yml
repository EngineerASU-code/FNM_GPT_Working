name: Validate Configurator 3.16.3
on:
  push:
    paths:
      - 'Configurator_v3.16.3.zip'
      - '.github/workflows/build-3-16-3.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source archive
        run: |
          rm -rf /tmp/app
          mkdir /tmp/app
          unzip -q Configurator_v3.16.3.zip -d /tmp/app
      - name: Restore and build
        working-directory: /tmp/app
        run: |
          dotnet restore Configurator.csproj -p:EnableWindowsTargeting=true
          dotnet build Configurator.csproj --configuration Release --no-restore -p:EnableWindowsTargeting=true
      - name: Verify archive
        run: unzip -t Configurator_v3.16.3.zip
