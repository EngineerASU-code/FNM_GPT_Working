name: Inspect 3.16.2
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source snapshot
        run: |
          rm -rf /tmp/app __source_snapshot
          mkdir /tmp/app __source_snapshot
          unzip -q Configurator_v3.16.2.zip -d /tmp/app
          cp -a /tmp/app/. __source_snapshot/
          find __source_snapshot -type f | sort > source-files.txt
          find __source_snapshot -name '*.csproj' -o -name '*.sln' | sort > project-files.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add __source_snapshot source-files.txt project-files.txt
          git commit -m 'chore: extract 3.16.2 source snapshot' || true
          git push
