name: Inspect 3.16.2
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect
        run: |
          rm -rf /tmp/app
          mkdir /tmp/app
          unzip -q Configurator_v3.16.2.zip -d /tmp/app
          find /tmp/app -maxdepth 4 -type f | sort > zip-files.txt
          find /tmp/app -name '*.csproj' -o -name '*.sln' | sort >> zip-files.txt
          cp /tmp/app/*.csproj . 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zip-files.txt *.csproj 2>/dev/null || true
          git commit -m 'chore: inspect 3.16.2 project structure' || true
          git push
