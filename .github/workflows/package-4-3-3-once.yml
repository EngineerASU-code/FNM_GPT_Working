name: Package Configurator 4.3.3 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-4-3-3-once.yml'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        shell: bash
        run: |
          set -e
          rm -f Configurator_v4.3.3.zip
          cd src-v4.0
          zip -qr ../Configurator_v4.3.3.zip . -x '*.git/*' -x 'bin/*' -x 'obj/*'
      - name: Publish archive to main
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Configurator_v4.3.3.zip
          git commit -m "build: Configurator 4.3.3 source archive" || true
          git push origin main
