name: Inspect 3.16.1 source

on:
  push:
    paths:
      - 'Configurator_v3.16.1.zip'
      - '.github/workflows/inspect-3161.yml'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract source
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q Configurator_v3.16.1.zip -d extracted
      - name: Upload extracted source
        uses: actions/upload-artifact@v4
        with:
          name: configurator-3.16.1-source
          path: extracted/
          retention-days: 3
